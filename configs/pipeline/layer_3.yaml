# Full pipeline: hidden state after the third complete backbone block -> Stage A -> Stage B.
# Paths are relative to this file.
model: ../model.yaml
stage_a: ../stage_a/levenberg_marquardt.yaml
stage_b: ../stage_b/k100.yaml

# How the hidden state of every --dataset prompt is generated. Prompts come only from
# the dataset file; each is used to create its hidden state and to score the result.
synthetic_observation:
  observation_layer: 3
  noise_seed: 100

# Runs per prompt. Repetition r of prompt id uses seeds hash(purpose, seed, id, r) for the
# noise and for Stage A/B starts (the seeds above and in the stage files are salts), so no
# seed is shared across prompts or repetitions. Results are keyed by (example_id, repetition).
repetitions: 1
