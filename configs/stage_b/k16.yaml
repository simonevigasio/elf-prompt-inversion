# Stage B: small greedy token search (16 candidates per position, 20 accepted swaps).
# Unlisted settings use the AttackConfig defaults (src/elf_inversion/tokens/attack.py):
# mode projected, k 16, candidate_batch_size 32. Pipeline only: add "trials: N" for
