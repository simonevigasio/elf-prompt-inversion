# Pinned ELF source, tokenizer, encoder and denoiser checkpoint, shared by both stages.
# elf_root is relative to this file: the official ELF checkout next to this repository.
elf_root: ../../ELF
elf_commit: 5098bf28b5e9b52c329970a7e4e1cc28251c76e6
elf_config: src/configs/training_configs/train_de-en_ELF-B.yml
tokenizer:
  repo: t5-small
  revision: df1b051c49625cf57a3d0d8d3863ed4d13564fe4
encoder:
  repo: embedded-language-flows/t5_small_encoder_jax
  revision: c77f0a84a7549dd1ca4b3976840150d46e9da7dd
  filename: t5_small_encoder_jax.pkl
denoiser:
  repo: embedded-language-flows/ELF-B-de-en
  revision: c8120fb80e52d4056abb5378cb9acaef3da6e65a
  checkpoint: checkpoint_0
  config: ELF-B-de-en.yml
  parameters: ema_params1
  # Hugging Face cache for the denoiser; /tmp is temporary, choose a persistent path if desired.
  cache_dir: /tmp/stage-b-hf
# Default prompt length of a loaded adapter (the 8-token verification prompt).
# Experiments resize the adapter to each prompt's own length.
prompt_length: 8
# Synthetic non-conditioning suffix: exactly one valid EOS, then EOS padding.
filler_token_ids: [1]
local_files_only: true
