# Stage A: matrix-free Levenberg-Marquardt over the reachable bottleneck codes.
# Observation metadata (prompt length, layer, ...) travels with each observation,
# not with the solver, so the same settings work for every layer.
max_iterations: 50
cg_max_iterations: 100
cg_rtol: 1.0e-4
cg_atol: 1.0e-8
residual_atol: 1.0e-5
residual_rtol: 1.0e-5
step_atol: 1.0e-8
step_rtol: 1.0e-7
stagnation_rtol: 1.0e-8
stagnation_iterations: 3
initial_damping: 1.0e-2
min_damping: 1.0e-8
max_damping: 1.0e12
damping_increase: 10.0
damping_decrease: 0.3
restarts: 3
seed: 42
prompt_init_std: 1.0
# Use the exact least-squares inverse at layer 0 when both proj2 maps are injective.
algebraic_layer_zero: true
