# Full synthetic Stage A -> Stage B run, observed after blocks_2 (third block).
adapter_config: ../../stage-b-prompt-inversion/configs/adapter.yaml
metadata:
  prompt_length: 8
  observation_layer: 3
  time: 0.0
  self_cond_cfg_scale: 1.0
  attention_mask: null
  forward_mode: first_sampling_pass
solver:
  max_iterations: 50
  cg_max_iterations: 100
  cg_rtol: 0.0001
  cg_atol: 0.00000001
  residual_atol: 0.00001
  residual_rtol: 0.00001
  step_atol: 0.00000001
  step_rtol: 0.0000001
  stagnation_rtol: 0.00000001
  stagnation_iterations: 3
  initial_damping: 0.01
  min_damping: 0.00000001
  max_damping: 1000000000000.0
  damping_increase: 10.0
  damping_decrease: 0.3
  restarts: 3
  seed: 42
  prompt_init_std: 1.0
  algebraic_layer_zero: true
stage_b:
  mode: projected
  k: 16
  candidate_batch_size: 32
  max_iterations: 20
  max_candidate_evaluations: 10000
  stopping_loss_tolerance: 0.00000001
stage_b_initialization_seed: 200
