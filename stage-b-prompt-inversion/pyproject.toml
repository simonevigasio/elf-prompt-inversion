[build-system]
requires = ["setuptools>=69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "elf-prompt-inversion"
version = "0.1.0"
description = "Native ELF prompt inversion forward adapter and equivalence checks"
requires-python = ">=3.10,<3.13"
dependencies = [
  "jax==0.4.38", "jaxlib==0.4.38", "flax==0.10.2",
  "orbax-checkpoint==0.5.23", "optax==0.2.5",
  "numpy>=1.26.4,<2", "PyYAML>=6.0.1", "einops>=0.7.0",
  "transformers==4.44.2", "huggingface-hub>=0.23,<1",
  "sentencepiece>=0.2,<0.3",
]

[project.optional-dependencies]
test = ["torch==2.3.0", "datasets>=2.19"]

[tool.setuptools.packages.find]
include = ["prompt_inversion*"]
